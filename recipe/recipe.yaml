schema_version: 1

context:
  name: trl
  version: "1.17.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/huggingface/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 7943beed446f3da319189ab658c31336af81140939367806b1ff630ea85be734

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - jinja2
    - packaging >20.0
    - python >=${{ python_min }}
    - transformers >=4.56.2
    - accelerate >=1.11.0
    - datasets >=4.7.0
    - pandas >=2.1.1
    - huggingface_hub >=0.34.0
    - numpy >=1.26.0
    - psutil >=5.9.4
    - pyarrow >=21.0.0
    - pyyaml >=6.0.1
    - pytorch >=2.6.0
tests:
  - python:
      imports:
        - trl
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Train transformer language models with reinforcement learning.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/huggingface/trl

extra:
  recipe-maintainers:
    - jan-janssen
